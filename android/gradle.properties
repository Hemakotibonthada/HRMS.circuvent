# The JVM the Gradle daemon runs in, not the one the app targets.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# AndroidX, always. The support library has been end-of-life for years.
android.useAndroidX=true

# Kotlin code style for the IDE.
kotlin.code.style=official

# Only build the resources the app actually references. Without this, every
# library's full resource table is compiled into R, which is most of the build
# time on a Compose project.
android.nonTransitiveRClass=true

# Configuration cache and parallel execution. Both are safe on a single-module
# project and cut the incremental build to a few seconds.
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
