<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-label="">
  <!--
    Landing hero artwork: an abstract rendering of the HRMS dashboard.

    Deliberately abstract. Every bar, ring and row here is a shape, not a
    number, because this file sits on a public marketing page and a chart with
    invented figures on it is a claim. The real dashboard renders real values.

    Drawn on its own light surface rather than on transparency so it reads the
    same way on the light and dark themes, the way a screenshot would.

    The reduced-motion guard is inside the file because a page stylesheet cannot
    reach into an <img>.
  -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f4ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#4c1d95" flood-opacity="0.16"/>
    </filter>
    <clipPath id="win"><rect x="60" y="52" width="880" height="560" rx="26"/></clipPath>

    <style>
      .win   { animation: floaty 9s ease-in-out infinite; transform-origin:500px 332px; }
      .fadeIn{ opacity:0; animation: fade .7s ease-out forwards; }
      .f2{animation-delay:.12s} .f3{animation-delay:.24s} .f4{animation-delay:.36s}

      /* Bars grow from their own baseline, hence a per-bar transform-origin. */
      .bar   { transform-box: fill-box; transform-origin: bottom;
               transform: scaleY(0); animation: grow .95s cubic-bezier(.16,1,.3,1) forwards; }
      .b2{animation-delay:.10s} .b3{animation-delay:.20s} .b4{animation-delay:.30s}
      .b5{animation-delay:.40s} .b6{animation-delay:.50s} .b7{animation-delay:.60s}

      .ringTrack { stroke:#ede9fe; }
      /* r=30 gives a circumference of 2*pi*30 = 188.5. The dasharray has to
         match it: a larger value covers the whole ring, so the sweep animates
         something already fully drawn and nothing appears to happen. Ending at
         60 leaves roughly two thirds of the ring showing. */
      .ringVal   { stroke:url(#brand); stroke-linecap:round;
                   stroke-dasharray:188.5; stroke-dashoffset:188.5;
                   animation: sweep 1.8s cubic-bezier(.16,1,.3,1) .3s forwards; }

      .av    { transform-box: fill-box; transform-origin:center; opacity:0;
               animation: pop .55s cubic-bezier(.16,1,.3,1) forwards; }
      .a2{animation-delay:.7s} .a3{animation-delay:.8s}
      .a4{animation-delay:.9s} .a5{animation-delay:1s}

      .row   { opacity:0; animation: slide .6s cubic-bezier(.16,1,.3,1) forwards; }
      .r2{animation-delay:.75s} .r3{animation-delay:.9s}

      .shine { animation: shine 5.5s ease-in-out infinite; }
      .blip  { animation: blip 2.6s ease-in-out infinite; }

      @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
      @keyframes fade   { to { opacity:1 } }
      @keyframes grow   { to { transform: scaleY(1) } }
      @keyframes sweep  { to { stroke-dashoffset:60 } }
      @keyframes pop    { 0%{opacity:0;transform:scale(.5)} 100%{opacity:1;transform:scale(1)} }
      @keyframes slide  { 0%{opacity:0;transform:translateX(-14px)} 100%{opacity:1;transform:translateX(0)} }
      @keyframes shine  { 0%{transform:translateX(-420px)} 55%,100%{transform:translateX(940px)} }
      @keyframes blip   { 0%,100%{opacity:.35;r:4} 50%{opacity:1;r:6} }

      @media (prefers-reduced-motion: reduce) {
        .win,.shine,.blip { animation:none }
        .fadeIn,.av,.row  { animation:none; opacity:1 }
        .bar { animation:none; transform:scaleY(1) }
        .ringVal { animation:none; stroke-dashoffset:60 }
      }
    </style>
  </defs>

  <g class="win">
    <rect x="60" y="52" width="880" height="560" rx="26" fill="url(#surface)" filter="url(#soft)"/>
    <rect x="60" y="52" width="880" height="560" rx="26" fill="none" stroke="#ddd6fe"/>

    <!-- title bar -->
    <path d="M60 78a26 26 0 0 1 26-26h828a26 26 0 0 1 26 26v34H60z" fill="#faf8ff"/>
    <circle cx="92" cy="82" r="6" fill="#ddd6fe"/>
    <circle cx="112" cy="82" r="6" fill="#e9d5ff"/>
    <circle cx="132" cy="82" r="6" fill="#ede9fe"/>
    <rect x="392" y="74" width="216" height="16" rx="8" fill="#f1ecff"/>

    <!-- sidebar -->
    <rect x="60" y="112" width="188" height="500" fill="#fbfaff"/>
    <rect x="248" y="112" width="1" height="500" fill="#ece7fd"/>
    <rect x="84" y="140" width="140" height="34" rx="10" fill="url(#brand)"/>
    <rect x="98" y="152" width="86" height="10" rx="5" fill="#ffffff" fill-opacity=".9"/>
    <g fill="#e9e3fb">
      <rect class="row"    x="84" y="188" width="140" height="30" rx="9"/>
      <rect class="row r2" x="84" y="228" width="140" height="30" rx="9"/>
      <rect class="row r3" x="84" y="268" width="140" height="30" rx="9"/>
      <rect x="84" y="308" width="140" height="30" rx="9" opacity=".65"/>
      <rect x="84" y="348" width="140" height="30" rx="9" opacity=".45"/>
    </g>

    <!-- stat cards -->
    <g class="fadeIn">
      <rect x="280" y="142" width="196" height="104" rx="16" fill="#ffffff" stroke="#ece7fd"/>
      <rect x="302" y="166" width="70" height="9" rx="4.5" fill="#c9c0ef"/>
      <rect x="302" y="188" width="104" height="20" rx="6" fill="url(#brand)"/>
      <rect x="302" y="220" width="132" height="7" rx="3.5" fill="#ece7fd"/>
    </g>
    <g class="fadeIn f2">
      <rect x="492" y="142" width="196" height="104" rx="16" fill="#ffffff" stroke="#ece7fd"/>
      <rect x="514" y="166" width="58" height="9" rx="4.5" fill="#c9c0ef"/>
      <rect x="514" y="188" width="84" height="20" rx="6" fill="url(#brandSoft)"/>
      <rect x="514" y="220" width="120" height="7" rx="3.5" fill="#ece7fd"/>
    </g>
    <g class="fadeIn f3">
      <rect x="704" y="142" width="212" height="104" rx="16" fill="#ffffff" stroke="#ece7fd"/>
      <rect x="726" y="166" width="76" height="9" rx="4.5" fill="#c9c0ef"/>
      <!-- present-today ring -->
      <circle cx="866" cy="196" r="30" fill="none" stroke-width="9" class="ringTrack"/>
      <circle cx="866" cy="196" r="30" fill="none" stroke-width="9" class="ringVal"
              transform="rotate(-90 866 196)"/>
      <rect x="726" y="190" width="92" height="16" rx="6" fill="#ede9fe"/>
      <rect x="726" y="216" width="64" height="7" rx="3.5" fill="#ece7fd"/>
    </g>

    <!-- headcount chart -->
    <g class="fadeIn f3">
      <rect x="280" y="270" width="408" height="316" rx="18" fill="#ffffff" stroke="#ece7fd"/>
      <rect x="304" y="298" width="118" height="10" rx="5" fill="#c9c0ef"/>
      <g stroke="#f3effe">
        <line x1="304" y1="380" x2="664" y2="380"/>
        <line x1="304" y1="432" x2="664" y2="432"/>
        <line x1="304" y1="484" x2="664" y2="484"/>
      </g>
      <g fill="url(#brandSoft)">
        <rect class="bar"    x="316" y="452" width="34" height="84"  rx="8"/>
        <rect class="bar b2" x="366" y="416" width="34" height="120" rx="8"/>
        <rect class="bar b3" x="416" y="438" width="34" height="98"  rx="8"/>
        <rect class="bar b4" x="466" y="386" width="34" height="150" rx="8"/>
        <rect class="bar b5" x="516" y="404" width="34" height="132" rx="8"/>
        <rect class="bar b6" x="566" y="352" width="34" height="184" rx="8"/>
        <rect class="bar b7" x="616" y="330" width="34" height="206" rx="8"/>
      </g>
      <line x1="304" y1="536" x2="664" y2="536" stroke="#e5dffb" stroke-width="2"/>
      <rect x="304" y="554" width="360" height="8" rx="4" fill="#f5f1ff"/>
    </g>

    <!-- team panel -->
    <g class="fadeIn f4">
      <rect x="704" y="270" width="212" height="316" rx="18" fill="#ffffff" stroke="#ece7fd"/>
      <rect x="726" y="298" width="92" height="10" rx="5" fill="#c9c0ef"/>

      <g>
        <circle class="av"    cx="746" cy="348" r="17" fill="#ddd6fe"/>
        <circle class="av a2" cx="786" cy="348" r="17" fill="#c4b5fd"/>
        <circle class="av a3" cx="826" cy="348" r="17" fill="#a78bfa"/>
        <circle class="av a4" cx="866" cy="348" r="17" fill="#8b5cf6"/>
        <circle class="av a5" cx="898" cy="348" r="15" fill="#ede9fe" stroke="#ddd6fe"/>
      </g>

      <g>
        <rect class="row"    x="726" y="396" width="168" height="42" rx="12" fill="#faf8ff"/>
        <circle class="row"  cx="750" cy="417" r="11" fill="#ddd6fe"/>
        <rect class="row"    x="770" y="410" width="96" height="8" rx="4" fill="#e6e0fb"/>
        <rect class="row"    x="770" y="424" width="60" height="7" rx="3.5" fill="#efeafd"/>

        <rect class="row r2"   x="726" y="448" width="168" height="42" rx="12" fill="#faf8ff"/>
        <circle class="row r2" cx="750" cy="469" r="11" fill="#c4b5fd"/>
        <rect class="row r2"   x="770" y="462" width="84" height="8" rx="4" fill="#e6e0fb"/>
        <rect class="row r2"   x="770" y="476" width="52" height="7" rx="3.5" fill="#efeafd"/>

        <rect class="row r3"   x="726" y="500" width="168" height="42" rx="12" fill="#faf8ff"/>
        <circle class="row r3" cx="750" cy="521" r="11" fill="#a78bfa"/>
        <rect class="row r3"   x="770" y="514" width="104" height="8" rx="4" fill="#e6e0fb"/>
        <rect class="row r3"   x="770" y="528" width="46" height="7" rx="3.5" fill="#efeafd"/>
      </g>
      <circle class="blip" cx="898" cy="298" r="4" fill="#8b5cf6"/>
    </g>

    <!-- light sweeping across the glass -->
    <g clip-path="url(#win)">
      <rect class="shine" x="-420" y="52" width="220" height="560" fill="url(#sheen)" opacity=".5"/>
    </g>
  </g>
</svg>
