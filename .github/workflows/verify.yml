name: verify

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A React Server Component cannot pass a function to a Client Component.
      # It type-checks, it lints, every unit test stays green — and the page
      # throws at render time, which the error boundary turns into a generic
      # failure. It reached production on five Paystub pages, including
      # approving a payroll run, and only broke for sessions holding the
      # permission to act, so a viewer saw a working page.
      - name: Audit server/client boundary
        run: npm run audit:rsc

      - name: Lint (new code, zero tolerance)
        run: npm run lint:strict

      # The whole-repo pass is now at zero errors; the remaining ~925 warnings
      # (no-explicit-any, no-console) are the Phase 2 cleanup backlog
      # (docs/ROADMAP.md §2.4).
      - name: Lint (whole repo, informational)
        run: npm run lint
        continue-on-error: true

      # Applies every migration to an in-memory Postgres and asserts that
      # row-level security actually blocks cross-tenant reads and writes.
      # Needs no external database.
      - name: Verify migrations and tenant isolation
        run: npm run db:verify

      # Proves the encryption backfill and key rotation against a real
      # Postgres engine. A rotation that re-wraps an existing envelope instead
      # of decrypting it first locks every MFA user out, and that is not a
      # mistake a unit test catches.
      - name: Verify encryption at rest
        run: npm run db:verify:encryption

      # Two routes were once fakes that returned 201 and wrote nothing. This
      # asserts records survive being written, stay inside their tenant, and
      # enforce the constraints that make them safe.
      - name: Verify module persistence
        run: npm run db:verify:modules

      # Asserts the list-query indexes are actually chosen by the planner,
      # including a counterfactual that drops one and checks the sort returns.
      # An index nothing chooses is pure write overhead.
      - name: Verify query plans
        run: npm run db:verify:plans

      # Both of these exist because a page that asks for a collection nothing
      # serves renders an empty state rather than an error, and fabricated data
      # is indistinguishable from real data to the person reading it. Neither
      # failure is visible in a screenshot.
      - name: Audit data paths
        run: npm run audit:data-paths

      - name: Audit for fabricated data
        run: npm run audit:fabricated

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The April audit found live credentials committed to source. This keeps
      # them from coming back.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
